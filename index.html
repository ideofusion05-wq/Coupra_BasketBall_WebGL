<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- NOTE: viewport-fit=cover REMOVED — was making canvas extend behind
         the iOS Safari URL bar / notch. Without it, browser keeps content
         within the safe area, so canvas renders fully visible. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="portrait">
    <title>Basket Ball Dunk</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #unity-container {
        /* Uses top+bottom (no explicit height) so browser auto-calculates
           the height = viewport - safeTop - safeBottom. JS overrides
           bottom/height at runtime ONLY if browser chrome (URL bar) takes
           extra space (iOS Safari bottom URL bar). */
        position: fixed;
        top:    env(safe-area-inset-top, 0);
        left:   env(safe-area-inset-left, 0);
        right:  env(safe-area-inset-right, 0);
        bottom: env(safe-area-inset-bottom, 0);
        background: #231F20;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #231F20;
        outline: none;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #unity-progress-bar-empty {
        width: 60vw;
        max-width: 320px;
        height: 14px;
        margin: 12px auto 0;
        background: rgba(255,255,255,0.15);
        border-radius: 8px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
        transition: width 0.15s ease;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translate(-50%, 0);
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        display: none;
        z-index: 10;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate-overlay .icon {
        font-size: 48px;
        margin-bottom: 16px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(-90deg); }
        50% { transform: rotate(0deg); }
      }
      @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
        #rotate-overlay { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>Loading…</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <div id="rotate-overlay">
      <div class="icon">⟳</div>
      <div><strong>Please rotate your device</strong></div>
      <div style="opacity:0.7;margin-top:8px;font-size:14px;">This game is best played in portrait mode.</div>
    </div>

    <!-- GameBull dependencies: socket.io-client (battle leaderboard) + qrcode-generator (battle QR) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" crossorigin="anonymous"></script>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = "block";
        if (type === 'error') warningBanner.style.background = "rgba(180,30,30,0.85)";
        else if (type === 'warning') warningBanner.style.background = "rgba(180,140,30,0.85)";
        setTimeout(function() { warningBanner.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        dataUrl: buildUrl + "/build.data.unityweb",
        frameworkUrl: buildUrl + "/build.framework.js.unityweb",
        codeUrl: buildUrl + "/build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ASN Games",
        productName: "Basket Ball Dunk",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
      };

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // NOTE: viewport-fit=cover REMOVED — was making canvas overlap the
        // iOS Safari URL bar / notch. Browser keeps content inside safe area now.
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute('content', 'width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no');
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // Compute the safe-area top offset in pixels (from CSS env()).
      // We can't read env() directly in JS, so we use a probe element.
      function getSafeTopPx() {
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0);visibility:hidden;width:1px;height:1px;';
        document.body.appendChild(probe);
        var top = probe.getBoundingClientRect().top;
        document.body.removeChild(probe);
        return Math.max(0, top);
      }

      // Get the safe-area-inset-bottom in pixels (probe element).
      function getSafeBottomPx() {
        var probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;bottom:env(safe-area-inset-bottom,0);visibility:hidden;width:1px;height:1px;';
        document.body.appendChild(probe);
        var bottom = window.innerHeight - probe.getBoundingClientRect().bottom;
        document.body.removeChild(probe);
        return Math.max(0, bottom);
      }

      // Conservative container sizing — picks the MINIMUM of available
      // size signals so the container NEVER overflows the visible area on
      // any browser. Trade-off: when browser URL bar later retracts, there
      // may be a small unused gap at the bottom (better than canvas bleed).
      //
      // Three signals checked:
      //   1. visualViewport.height — most accurate visible area
      //   2. window.innerHeight   — Chrome's layout viewport (excludes URL bar)
      //   3. document.documentElement.clientHeight — root element height
      // Use min() of all three to be safe.
      function syncContainerSize() {
        var vv = window.visualViewport;
        var safeTop    = getSafeTopPx();
        var safeBottom = getSafeBottomPx();
        var vvOffsetTop = (vv && vv.offsetTop) || 0;

        // Minimum-height strategy: pick the SMALLEST viewport signal.
        var candidates = [];
        if (vv) candidates.push(vv.height);
        candidates.push(window.innerHeight);
        if (document.documentElement && document.documentElement.clientHeight) {
          candidates.push(document.documentElement.clientHeight);
        }
        var minH = Math.min.apply(null, candidates);

        var topPx    = Math.max(safeTop, vvOffsetTop);
        var leftPx   = (vv && vv.offsetLeft) || 0;
        var widthPx  = (vv && vv.width) || window.innerWidth;
        // Subtract safe area top adjustment + safe bottom.
        var heightPx = minH - (topPx - vvOffsetTop) - safeBottom;

        container.style.top    = topPx    + 'px';
        container.style.left   = leftPx   + 'px';
        container.style.right  = 'auto';
        container.style.bottom = 'auto';
        container.style.width  = widthPx  + 'px';
        container.style.height = Math.max(0, heightPx) + 'px';
      }

      function resizeCanvas() {
        canvas.style.width  = container.clientWidth  + 'px';
        canvas.style.height = container.clientHeight + 'px';
      }

      function syncAll() {
        syncContainerSize();
        resizeCanvas();
      }

      window.addEventListener('resize', syncAll);
      window.addEventListener('orientationchange', function () { setTimeout(syncAll, 200); });
      if (window.visualViewport) {
        // Fires when iOS Safari's URL bar shows/hides, when keyboard opens, etc.
        window.visualViewport.addEventListener('resize', syncAll);
        window.visualViewport.addEventListener('scroll', syncAll);
      }
      syncAll();
      // Delayed re-syncs to catch late URL bar animations / Chrome's
      // post-load address-bar adjustments on Android.
      setTimeout(syncAll, 100);
      setTimeout(syncAll, 500);
      setTimeout(syncAll, 1500);

      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // ====================================================================
      // Mobile keyboard handling
      // ====================================================================
      // When a Unity InputField gets focus on mobile, Unity creates a hidden
      // HTML <input> overlay at the InputField's screen position. The mobile
      // browser auto-scrolls the page (often pushing the ENTIRE Unity canvas
      // off-screen) to bring this input into view. We intercept this:
      //   1. Force window.scrollY back to 0 (undo browser auto-scroll).
      //   2. Use visualViewport to detect keyboard height.
      //   3. Translate the unity-container UP only enough to keep the input
      //      visible just above the keyboard.
      // ====================================================================
      (function () {
        if (!isMobile) return;
        var FOCUS_DELAY_MS  = 300;   // wait for keyboard to finish appearing
        var EXTRA_MARGIN    = 12;    // visual margin above keyboard
        var ABSOLUTE_CAP_PX = 180;   // HARD ceiling on translation — prevents
                                     // panel flying off the top of screen.
        var KEEP_FROM_TOP   = 0.30;  // when translating, keep input at most
                                     // this fraction of viewport from top.

        function clearTranslate() {
          container.style.transform = '';
        }

        function parseCurrentTranslateY() {
          var m = (container.style.transform || '').match(/translateY\((-?[\d.]+)px\)/);
          return m ? Math.abs(parseFloat(m[1])) : 0;
        }

        // Incremental adjustment. Reads the CURRENT on-screen rect (which
        // already includes any applied transform) and ONLY adds more upward
        // translation if the input has fallen below the visible area.
        // Never resets / re-computes from original — that was causing the
        // canvas to drift UP on every keystroke as iOS's predictive bar
        // shrank visualViewport.
        function adjustForActiveInput() {
          var active = document.activeElement;
          if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) {
            clearTranslate();
            return;
          }

          var vv       = window.visualViewport;
          var visibleH = vv ? vv.height : window.innerHeight;
          var keyboardOpen = (window.innerHeight - visibleH) > 100;
          if (!keyboardOpen) {
            clearTranslate();
            window.scrollTo(0, 0);
            return;
          }

          // rect = CURRENT on-screen rect (includes existing transform).
          var rect    = active.getBoundingClientRect();
          var current = parseCurrentTranslateY();

          // If input is already comfortably visible, do nothing — this is
          // the key fix that prevents drift on each keystroke.
          if (rect.bottom <= visibleH - 4) {
            window.scrollTo(0, 0);
            return;
          }

          // Input is below the visible area — translate further up by the
          // amount needed PLUS margin, on top of current translate.
          var additional   = rect.bottom - visibleH + EXTRA_MARGIN;
          var newTranslate = current + additional;

          // Cap 1: absolute ceiling.
          newTranslate = Math.min(newTranslate, ABSOLUTE_CAP_PX);

          // Cap 2: don't push input top above KEEP_FROM_TOP * visibleH.
          // After applying newTranslate, input top will be at
          // (rect.top - (newTranslate - current)).
          var minAllowedTop = visibleH * KEEP_FROM_TOP;
          var topAfter      = rect.top - (newTranslate - current);
          if (topAfter < minAllowedTop) {
            newTranslate = Math.max(current, current + (rect.top - minAllowedTop));
          }

          if (Math.abs(newTranslate - current) > 1) {
            container.style.transition = 'transform 0.2s ease';
            container.style.transform  = 'translateY(' + (-newTranslate) + 'px)';
          }
          window.scrollTo(0, 0);
        }

        document.addEventListener('focusin', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
          // Browser hasn't shown keyboard yet — wait a bit.
          setTimeout(adjustForActiveInput, FOCUS_DELAY_MS);
        }, true);

        document.addEventListener('focusout', function () {
          // Small delay so focus can move to another input without flicker.
          setTimeout(function () {
            var a = document.activeElement;
            if (!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA')) {
              clearTranslate();
              window.scrollTo(0, 0);
            }
          }, 50);
        }, true);

        // NOTE: We DELIBERATELY do NOT re-run adjustForActiveInput on
        // visualViewport resize. Reason: on iOS Japanese IME, each character
        // typed shrinks the visible area (kanji candidate bar grows), which
        // would push the canvas further up on every keystroke. We lock the
        // translation at focusin time and only release on focusout.
        // (syncContainerSize is still re-run by the outer listener so the
        // canvas itself keeps fitting the visible area.)

        // Belt-and-braces: any time browser tries to scroll the body, undo it.
        window.addEventListener('scroll', function () {
          if (window.scrollY !== 0) window.scrollTo(0, 0);
        }, { passive: true });
      })();
    </script>
  </body>
</html>
